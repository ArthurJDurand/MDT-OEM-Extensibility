name: 💡 Feature Request
description: Suggest a new vendor, tool, schema change, or improvement
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
assignees:
  - ArthurJDurand

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an improvement. Before submitting, please:

        1. **Search [existing issues](https://github.com/ArthurJDurand/MDT-OEM-Extensibility/issues)** and **[Discussions](https://github.com/ArthurJDurand/MDT-OEM-Extensibility/discussions)** to avoid duplicates.
        2. **Check the [CONTRIBUTING.md → Areas Where Help Is Needed](https://github.com/ArthurJDurand/MDT-OEM-Extensibility/blob/main/CONTRIBUTING.md#areas-where-help-is-needed)** section — your idea may already be on the roadmap.
        3. **Review the [Known Limitations](https://github.com/ArthurJDurand/MDT-OEM-Extensibility#known-limitations)** section in the README.

        For open-ended ideas or brainstorming, please start a **[Discussion](https://github.com/ArthurJDurand/MDT-OEM-Extensibility/discussions)** instead of an issue.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      description: Please confirm you have completed these steps before filing.
      options:
        - label: I have searched existing issues and Discussions, and this has not been suggested before.
          required: true
        - label: I have read the CONTRIBUTING.md "Areas Where Help Is Needed" section.
          required: true
        - label: I have read the Known Limitations section in the README.
          required: true

  - type: dropdown
    id: category
    attributes:
      label: Feature category
      description: What type of feature are you requesting?
      options:
        - New vendor recipe
        - Vendor recipe update (URL, hash, version)
        - New vendor asset (wallpaper, customization script, registry file)
        - New build tool
        - Build tool improvement
        - Recipe schema change
        - WinPE map builder improvement
        - New source type (alternative download method)
        - Documentation
        - Build, CI, or repository infrastructure
        - Refactor or code quality
        - Other (specify in Description)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this feature solve? Describe the pain point, not the solution.
      placeholder: |
        Example: The Dell recipe marks three UWP packages as "manual" because
        winget download does not work for MSStore-only packages. Every user of
        the recipe has to manually fetch these files, which defeats the purpose
        of the build tool.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen? Be as specific as you can.
      placeholder: |
        Example: Add a new source type "msstore-msix" that uses the Microsoft
        Store API to fetch the .msix bundle using a Microsoft Entra ID
        application. Users who configure the app registration in the recipe
        can then fetch UWP packages automatically.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider? Why did you reject them?
      placeholder: |
        Example: I considered scraping the Microsoft Store website, but the
        URLs are session-bound and expire. I considered requiring an interactive
        login, but that defeats unattended builds.
    validations:
      required: false

  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Describe your scenario. What vendors, apps, and workflows are involved?
      placeholder: |
        - Vendors affected: Dell, HP, Lenovo
        - Apps affected: Dell SupportAssist UWP, Dell Command Update UWP, HP Support Assistant MSIX
        - Frequency: weekly rebuild for a production deployment share
        - Downstream: images deployed via MDT-Zero-Touch-Deployment
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Examples, references, or mockups
      description: |
        Links to other projects, Microsoft documentation, vendor documentation,
        or code sketches that demonstrate what you have in mind. If you have a
        working prototype, share it.
      placeholder: |
        Example: Microsoft documents the Store submission API here:
        https://learn.microsoft.com/en-us/windows/uwp/monetize/...
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Willingness to contribute
      description: This project is maintained by a single person in their spare time. Contributions are very welcome.
      options:
        - label: I am willing to submit a pull request implementing this feature.
          required: false
        - label: I am willing to test a proposed implementation on a real build host.
          required: false
        - label: I am willing to help with documentation for this feature.
          required: false
        - label: I would only like to see this feature implemented (no contribution planned).
          required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help evaluate this request.
    validations:
      required: false
